# Push a tag like v0.2.0 to publish a GitHub Release with the solution zips (unmanaged and managed)
# attached, and the matching CHANGELOG.md section as its notes.
# The tag must match "version" in solution/solution.config.json and apps/web/package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the solution version
        run: |
          version=$(node -p "require('./solution/solution.config.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match solution version $version" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm solution
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > out/release-notes.md
          if [ ! -s out/release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          body_path: out/release-notes.md
